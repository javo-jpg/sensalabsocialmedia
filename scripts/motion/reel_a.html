<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:ID;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf);font-weight:800}
@font-face{font-family:ID;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf);font-weight:500}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05040d;font-family:ID}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
.mask{overflow:hidden;display:block;padding-bottom:.08em}
.mask>span{display:inline-block;will-change:transform}
.h{font-weight:800;letter-spacing:-.045em;line-height:.95;color:#fff}
.card{position:absolute;left:70px;right:70px;height:720px;top:800px;border-radius:48px;overflow:hidden;box-shadow:0 50px 120px rgba(0,0,0,.55)}
.card img{position:absolute;left:-6%;width:112%;top:-7%;will-change:transform}
.kick{position:absolute;left:80px;top:150px;font-weight:500;font-size:32px;letter-spacing:.16em;color:#b9adff}
.foot{position:absolute;left:80px;right:80px;bottom:90px;display:flex;justify-content:space-between;align-items:center}
.pill{border:2px solid rgba(255,255,255,.7);color:#fff;border-radius:99px;padding:8px 22px;font:500 28px ID;letter-spacing:.06em}
.wipe{position:absolute;inset:0;background:linear-gradient(120deg,#3b2bff,#9b7bff);transform-origin:left}
</style></head><body>

<!-- S1: logo reveal + "Not a studio." -->
<div class="scene" id="s1">
  <div class="glow" id="s1g" style="width:900px;height:900px;left:90px;top:420px;background:#3b2bff"></div>
  <img id="s1logo" src="../../brand/logos/logo-3d.png" style="position:absolute;width:1500px;left:-210px;top:330px;mix-blend-mode:screen">
  <div style="position:absolute;left:80px;right:80px;top:1260px">
    <div class="mask h" style="font-size:150px"><span id="s1a">Not a</span></div>
    <div class="mask h" style="font-size:150px"><span id="s1b">studio.</span></div>
  </div>
</div>

<!-- S2: "A lab." on light -->
<div class="scene" id="s2" style="background:#ece6ff">
  <div class="glow" style="width:1100px;height:1100px;left:300px;top:900px;background:#8d7bff;opacity:.9"></div>
  <div class="glow" style="width:800px;height:800px;left:-200px;top:-100px;background:#fff"></div>
  <img id="s2sym" src="../../brand/logos/symbol-dark.png" style="position:absolute;width:520px;left:80px;top:300px">
  <div style="position:absolute;left:80px;top:760px">
    <div class="mask h" style="font-size:300px;color:#1c1466"><span id="s2a">A lab.</span></div>
  </div>
  <div id="s2sub" style="position:absolute;left:84px;top:1120px;font:500 46px/1.3 ID;color:#1c1466;opacity:.8;max-width:820px">We build interactive experiences people actually touch.</div>
</div>

<!-- S3..S5: product beats -->
<div class="scene" id="s3"><div class="glow" style="width:900px;height:900px;left:400px;top:-200px;background:#3b2bff"></div><div class="glow" style="width:800px;height:800px;left:-300px;top:1300px;background:#7a3cff"></div>
  <div class="kick">01 · SENSA MIRROR</div>
  <div style="position:absolute;left:80px;right:80px;top:240px"><div class="mask h" style="font-size:132px"><span id="s3a">Mirrors that</span></div><div class="mask h" style="font-size:132px"><span id="s3b">restyle you.</span></div></div>
  <div class="card" id="s3c"><img id="s3i" src="../../media/1X1YSGm8G7HswgTgo_4cZTw_rsWAU1tyW.jpg"></div>
  <div class="wipe" id="s3w"></div></div>
<div class="scene" id="s4"><div class="glow" style="width:900px;height:900px;left:-300px;top:-200px;background:#3b2bff"></div><div class="glow" style="width:800px;height:800px;left:500px;top:1300px;background:#7a3cff"></div>
  <div class="kick">02 · SENSA ARCADE</div>
  <div style="position:absolute;left:80px;right:80px;top:240px"><div class="mask h" style="font-size:132px"><span id="s4a">Games that</span></div><div class="mask h" style="font-size:132px"><span id="s4b">sell for you.</span></div></div>
  <div class="card" id="s4c"><img id="s4i" src="../../media/1uo7IBU4jwBAJKNdAOhZvF1NyTGWv00J2.jpg"></div>
  <div class="wipe" id="s4w"></div></div>
<div class="scene" id="s5"><div class="glow" style="width:900px;height:900px;left:400px;top:-200px;background:#3b2bff"></div><div class="glow" style="width:800px;height:800px;left:-300px;top:1300px;background:#7a3cff"></div>
  <div class="kick">03 · AVATARS</div>
  <div style="position:absolute;left:80px;right:80px;top:240px"><div class="mask h" style="font-size:132px"><span id="s5a">Avatars that</span></div><div class="mask h" style="font-size:132px"><span id="s5b">wave back.</span></div></div>
  <div class="card" id="s5c"><img id="s5i" src="../../media/1KZTBuZ5E3p2JoF0QJYCCr7oPTc05AbJk.jpg"></div>
  <div class="wipe" id="s5w"></div></div>

<!-- S6: end card -->
<div class="scene" id="s6">
  <div class="glow" id="s6g" style="width:1000px;height:1000px;left:40px;top:300px;background:#3b2bff"></div>
  <img id="s6logo" src="../../brand/logos/logo-3d.png" style="position:absolute;width:1300px;left:-110px;top:380px;mix-blend-mode:screen">
  <img id="s6word" src="../../brand/logos/wordmark-white.png" style="position:absolute;width:640px;left:220px;top:1270px">
  <div id="s6t" style="position:absolute;left:0;right:0;top:1440px;text-align:center;font:500 40px ID;color:#cfc7ff">Interactive experiences for brands + agencies</div>
  <div class="foot" id="s6f" style="justify-content:center"><span class="pill">SENSALAB.IO · LOS ANGELES</span></div>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),4);            // easeOutQuart
const eio=x=>{x=clamp(x);return x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2};
const p=(t,a,b)=>clamp((t-a)/(b-a));
const S=[['s1',0,2.4],['s2',2.4,4.0],['s3',4.0,6.0],['s4',6.0,8.0],['s5',8.0,10.0],['s6',10.0,13.0]];
function rise(el,t,a,dur=.55){const k=eo(p(t,a,a+dur));el.style.transform=`translateY(${(1-k)*110}%)`}
function out(el,t,a,dur=.35){const k=eio(p(t,a,a+dur));return k}
window.render=function(t){
  for(const [id,a,b] of S){$(id).style.opacity=(t>=a&&t<b)?1:0}
  // S1
  {const k=eo(p(t,0,1.6));$('s1logo').style.transform=`perspective(1600px) rotateY(${(1-k)*-55+Math.sin(t*1.2)*6}deg) rotateX(${(1-k)*18}deg) scale(${.7+.3*k})`;
   $('s1logo').style.opacity=k; $('s1g').style.opacity=.35+.35*k; rise($('s1a'),t,.7); rise($('s1b'),t,.85);}
  // S2
  {rise($('s2a'),t,2.45,.5);const k=eo(p(t,2.4,3.2));$('s2sym').style.transform=`translateX(${(1-k)*-300}px) rotate(${(1-k)*-20}deg)`;$('s2sym').style.opacity=k;
   const k2=eo(p(t,2.8,3.4));$('s2sub').style.transform=`translateY(${(1-k2)*40}px)`;$('s2sub').style.opacity=.8*k2;}
  // S3..S5
  for(const [n,a] of [[3,4.0],[4,6.0],[5,8.0]]){
    const w=$('s'+n+'w');const kw=eio(p(t,a,a+.45));w.style.transform=`scaleX(${1-kw})`;w.style.transformOrigin='right';
    rise($('s'+n+'a'),t,a+.15);rise($('s'+n+'b'),t,a+.27);
    const kc=eo(p(t,a+.1,a+.9));$('s'+n+'c').style.transform=`translateY(${(1-kc)*260}px)`;$('s'+n+'c').style.opacity=kc;
    const drift=p(t,a,a+2);$('s'+n+'i').style.transform=`translate3d(0,${-drift*30}px,0) scale(${1.04-drift*.03})`;
  }
  // S6
  {const k=eo(p(t,10,11.3));$('s6logo').style.transform=`perspective(1600px) rotateY(${(1-k)*50+Math.sin(t*1.1)*5}deg) scale(${.75+.25*k})`;$('s6logo').style.opacity=k;
   $('s6g').style.opacity=.3+.4*k;const k2=eo(p(t,10.8,11.6));$('s6word').style.opacity=k2;$('s6word').style.transform=`translateY(${(1-k2)*40}px)`;
   const k3=eo(p(t,11.2,11.9));$('s6t').style.opacity=k3;$('s6f').style.opacity=k3;}
};
window.DURATION=13;
render(0);
</script></body></html>
